<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyCart | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .auth-container h2 { text-align: center; margin-bottom: 20px; color: #2874f0; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-auth { width: 100%; background: #fb641b; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .toggle-link { text-align: center; margin-top: 15px; display: block; color: #2874f0; cursor: pointer; }
    </style>
</head>
<body style="background-color: #f1f3f6;">
    <header>
        <div class="logo"><a href="index.html" style="color: white; text-decoration: none;">MyCart</a></div>
    </header>

    <div class="auth-container" id="login-box">
        <h2>Login</h2>
        <form id="login-form">
            <div class="form-group"><input type="email" id="login-email" required placeholder="Email Address"></div>
            <div class="form-group"><input type="password" id="login-password" required placeholder="Password"></div>
            <button type="submit" class="btn-auth">Login</button>
        </form>
        <span class="toggle-link" onclick="toggleAuth()">Don't have an account? Register</span>
    </div>

    <div class="auth-container" id="register-box" style="display: none;">
        <h2>Register</h2>
        <form id="register-form">
            <div class="form-group"><input type="text" id="reg-name" required placeholder="Full Name"></div>
            <div class="form-group"><input type="email" id="reg-email" required placeholder="Email Address"></div>
            <div class="form-group"><input type="password" id="reg-password" required placeholder="Password"></div>
            <button type="submit" class="btn-auth">Create Account</button>
        </form>
        <span class="toggle-link" onclick="toggleAuth()">Already have an account? Login</span>
    </div>

    <script>
        function toggleAuth() {
            const loginBox = document.getElementById('login-box');
            const regBox = document.getElementById('register-box');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                regBox.style.display = 'none';
            } else {
                loginBox.style.display = 'none';
                regBox.style.display = 'block';
            }
        }

        // Registration Logic
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('reg-name').value,
                    email: document.getElementById('reg-email').value,
                    password: document.getElementById('reg-password').value
                })
            });
            const data = await res.json();
            alert(data.message);
            if (res.ok) toggleAuth(); // Switch to login after success
        });

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('mycart_user', JSON.stringify(data.user)); // Save user session
                alert("Welcome back, " + data.user.name + "!");
                window.location.href = "index.html";
            } else {
                alert(data.message);
            }
        });
    </script>
</body>
</html>
