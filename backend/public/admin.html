<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    
    <script>
        // Security Check
        let isAdmin = false;
        try {
            const user = JSON.parse(localStorage.getItem('mycart_user'));
            if (user && user.role === 'admin') {
                isAdmin = true;
            }
        } catch(e) {}

        if (!isAdmin) {
            document.write("<h2 style='font-family: Arial; text-align: center; margin-top: 50px; color: red;'>🔒 Access Denied. Redirecting to Login...</h2>");
            setTimeout(() => { window.location.href = "login.html"; }, 1500);
            window.stop();
        }
    </script>
    
    <!-- The rest of your head content (CSS links, etc.) goes here -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCart | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { padding: 30px; max-width: 1000px; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 15px; text-align: left; }
        th { background-color: #f4f4f4; }
        .status-pending { color: #d97706; font-weight: bold; background: #fef3c7; padding: 4px 8px; border-radius: 4px;}
        .status-shipped { color: #059669; font-weight: bold; background: #d1fae5; padding: 4px 8px; border-radius: 4px;}
        .btn-ship { background: #2874f0; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-ship:hover { background: #1a5cbf; }
    </style>
    
</head>
<body style="background-color: #f1f3f6;">
    <header>
        <div class="logo">MyCart Admin Dashboard</div>
    </header>

    <div class="admin-container">
        <h2>Manage Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <tr><td colspan="4">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>
  

    <!-- Your existing admin.js link -->
    <script src="admin.js"></script>
</body>
</html>

    <script src="admin.js"></script>
</body>
</html>
